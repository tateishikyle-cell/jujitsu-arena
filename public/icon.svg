<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2032"/>
      <stop offset="100%" stop-color="#10111b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4fb6a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a69aff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#303143" stroke-width="2" stroke-dasharray="8 8"/>
  <g filter="url(#glow)">
    <!-- Stylized JJK cursed seal '術' character symbol -->
    <path d="M190 140 H322 M256 130 V220 M180 230 H332 M220 230 L160 380 M290 230 L350 380 M210 290 H302 M256 280 V420"
          stroke="#d4fb6a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="256" cy="256" r="16" fill="#ffffff"/>
  </g>
</svg>
